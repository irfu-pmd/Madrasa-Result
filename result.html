    <style>
        :root {
            --primary: #065279;
            --gold: #d4af37;
            --success: #27ae60;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6, 82, 121, 0.6); 
            z-index: -1;
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(8px);
            padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.5); 
            width: 100%; max-width: 450px; text-align: center; 
            border-top: 8px solid var(--gold);
            animation: fadeInBody 1s ease-in-out;
            position: relative;
            z-index: 10;
        }
        @keyframes fadeInBody { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .logo-container { width: 80px; margin: 0 auto 10px auto; display: block; }
        .logo-container img { width: 100%; height: auto; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        h2 { color: var(--primary); font-size: 24px; margin: 10px 0 5px 0; font-weight: 900; }
        .sub-txt { color: #d35400; font-weight: bold; margin-bottom: 25px; font-size: 14px; background: #fffdf5; padding: 5px 15px; border-radius: 20px; display: inline-block; border: 1px solid #fdebd0;}

        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; color: #333; display: block; margin-bottom: 5px; font-size: 14px;}
        select, input { 
            width: 100%; padding: 12px; border: 2px solid #ddd; 
            border-radius: 10px; font-size: 15px; outline: none; transition: 0.3s;
            box-sizing: border-box; background: #f9f9f9;
        }
        select:focus, input:focus { border-color: var(--primary); background: #fff; }

        .search-btn { 
            background: linear-gradient(45deg, var(--primary), #1a7fb3); 
            color: white; padding: 15px; border: none; border-radius: 10px; 
            width: 100%; margin-top: 10px; cursor: pointer; 
            font-size: 16px; font-weight: bold; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(6, 82, 121, 0.3);
        }
        .search-btn:hover { background: linear-gradient(45deg, #1a7fb3, var(--primary)); transform: translateY(-2px); }

        /* Report Card Styles */
        #result { margin-top: 25px; display: none; }
        .report-card { 
            padding: 20px; border-radius: 15px; border: 2px solid var(--primary);
            background: white; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); text-align: left;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .student-name { font-size: 18px; color: var(--primary); font-weight: 800; text-align: center; margin-bottom: 15px; border-bottom: 2px dashed #eee; padding-bottom: 10px;}
        .student-details { font-size: 12px; color: #666; text-align: center; margin-top: -10px; margin-bottom: 15px; font-weight: bold;}
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 10px; border: 1px solid #eee; text-align: left; font-size: 14px; }
        th { background-color: #f0f4f8; color: var(--primary); }
        td:last-child, th:last-child { text-align: center; font-weight: bold; }
        
        .total-row { background-color: var(--primary); color: white; font-weight: bold; }
        .total-row td { border-color: var(--primary); }
        
        .grade-box { text-align: center; margin-bottom: 15px; font-size: 15px; font-weight: bold; color: #d35400;}
        .grade-box span { font-size: 20px; color: var(--success); }

        .whatsapp-btn { 
            background: #25D366; color: white; padding: 12px; 
            text-decoration: none; border-radius: 8px; 
            display: block; text-align: center; font-weight: bold;
            font-size: 15px; margin-bottom: 10px;
        }
        
        /* Fixed Back Button inside container */
        .back-home-btn { 
            display: block; background: #f0f4f8; color: var(--primary); 
            padding: 12px; text-decoration: none; border-radius: 10px; 
            font-weight: bold; font-size: 15px; text-align: center;
            transition: 0.3s; margin-top: 15px; border: 1px solid #ddd;
        }
        .back-home-btn:hover { background: #e2e8f0; }
    </style>

    function checkResult() {
        const classVal = document.getElementById('class').value;
        const input = document.getElementById('studentName').value.trim().toLowerCase();
        const resultDiv = document.getElementById('result');

        if (!classVal || !input) {
            alert("ദയവായി ക്ലാസ്സും പേരോ നമ്പറോ നൽകുക.");
            return;
        }

        const classList = examResults[classVal] || [];
        
        const student = classList.find(s => {
            const nameMatchEn = s.en.toLowerCase().includes(input);
            const nameMatchMl = s.ml.includes(input);
            const admMatch = s.admNo && s.admNo === input;
            const uidMatch = s.uid && s.uid.toLowerCase() === input;
            
            return nameMatchEn || nameMatchMl || admMatch || uidMatch;
        });

        resultDiv.style.display = 'block';
        if (student) {
            
            let marksHtml = '';
            for (const [subject, mark] of Object.entries(student.marks)) {
                marksHtml += `<tr><td>${subject}</td><td>${mark}</td></tr>`;
            }

            const msg = encodeURIComponent(`${student.ml} ന്റെ പാദവാർഷിക പരീക്ഷാ ഫലം:\nആകെ മാർക്ക്: ${student.total}/${student.outOf}\nഗ്രേഡ്: ${student.grade}\nകൂടുതൽ വിവരങ്ങൾക്ക് മദ്രസ വെബ്സൈറ്റ് സന്ദർശിക്കുക.`);
            
            const uidDisplay = student.uid ? `UID: ${student.uid.toUpperCase()} | ` : '';
            
            resultDiv.innerHTML = `
                <div class="report-card">
                    <div class="student-name"><i class="fa-solid fa-user-graduate"></i> ${student.ml}</div>
                    <div class="student-details">${uidDisplay}Adm No: ${student.admNo}</div>
                    
                    <table>
                        <thead>
                            <tr><th>വിഷയം (Subject)</th><th>മാർക്ക്</th></tr>
                        </thead>
                        <tbody>
                            ${marksHtml}
                            <tr class="total-row"><td>ആകെ മാർക്ക് (Total)</td><td>${student.total} / ${student.outOf}</td></tr>
                        </tbody>
                    </table>

                    <div class="grade-box">
                        നേടിയ ഗ്രേഡ്: <span>${student.grade}</span>
                    </div>

                    <a class="whatsapp-btn" href="https://wa.me/?text=${msg}" target="_blank">
                        <i class="fa-brands fa-whatsapp"></i> ഫലം വാട്സാപ്പിൽ അയക്കുക
                    </a>
                </div>
            `;

            // Confetti Animation Trigger! 🎉
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#065279', '#d4af37', '#27ae60', '#e74c3c', '#f1c40f'],
                zIndex: 9999
            });

        } else {
            resultDiv.innerHTML = `
                <div class="report-card" style="border-color:#e74c3c; text-align:center;">
                    <span style="font-size: 40px;">🔍</span><br>
                    <p style="color:#c0392b; font-weight:bold; margin-top:10px;">ക്ഷമിക്കണം, ഈ വിവരങ്ങൾ വെച്ച് റിസൾട്ട് കണ്ടെത്താനായില്ല. ടൈപ്പ് ചെയ്തത് ശരിയാണോ എന്ന് പരിശോധിക്കുക.</p>
                </div>`;
        }
    }
</script>
