    const publishDate = new Date("July 30, 2026 15:30:00").getTime();

    const timerInterval = setInterval(function() {
        const now = new Date().getTime();
        const distance = publishDate - now;

        if (distance <= 0) {
            // സമയം ആയി! ടൈമർ ഹൈഡ് ആക്കുക, സേർച്ച് ബോക്സ് കാണിക്കുക
            clearInterval(timerInterval);
            document.getElementById("countdown-section").style.display = "none";
            document.getElementById("search-section").style.display = "block";
        } else {
            // സമയം ആയില്ല, ടൈമർ കാണിക്കുക
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // ഫോർമാറ്റ് 00:00:00 ആയി കാണിക്കാൻ
            const h = hours < 10 ? "0" + hours : hours;
            const m = minutes < 10 ? "0" + minutes : minutes;
            const s = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("timer").innerHTML = h + "h " + m + "m " + s + "s";
        }
    }, 1000);

    function checkResult() {
        const classVal = document.getElementById('class').value;
        const input = document.getElementById('studentName').value.trim().toLowerCase();
        const resultDiv = document.getElementById('result');

        if (!classVal || !input) {
            alert("ദയവായി ക്ലാസ്സും പേരോ നമ്പറോ നൽകുക.");
            return;
        }

        const classList = examResults[classVal] || [];
        
        const student = classList.find(s => {
            const nameMatchEn = s.en.toLowerCase().includes(input);
            const nameMatchMl = s.ml.includes(input);
            const admMatch = s.admNo && s.admNo === input;
            const uidMatch = s.uid && s.uid.toLowerCase() === input;
            
            return nameMatchEn || nameMatchMl || admMatch || uidMatch;
        });

        resultDiv.style.display = 'block';
        if (student) {
            
            let marksHtml = '';
            for (const [subject, mark] of Object.entries(student.marks)) {
                marksHtml += `<tr><td>${subject}</td><td>${mark}</td></tr>`;
            }

            const msg = encodeURIComponent(`${student.ml} ന്റെ പാദവാർഷിക പരീക്ഷാ ഫലം:\nആകെ മാർക്ക്: ${student.total}/${student.outOf}\nശതമാനം: ${student.percentage}%\nഗ്രേഡ്: ${student.grade}\nസ്റ്റാറ്റസ്: ${student.status}\nകൂടുതൽ വിവരങ്ങൾക്ക് മദ്രസ വെബ്സൈറ്റ് സന്ദർശിക്കുക.`);
            
            const uidDisplay = student.uid ? `UID: ${student.uid.toUpperCase()} | ` : '';
            const statusClass = student.status === 'PROMOTED' ? 'promoted' : 'needs-improvement';
            const statusDisplay = student.status !== '-' ? `<div class="status-badge ${statusClass}">${student.status}</div>` : '';
            
            resultDiv.innerHTML = `
                <div id="printable-area" class="report-card">
                    <div class="print-header">
                        <img src="1000085715.webp" alt="Madrasa Logo">
                        <h1>അൻവാറുൽ ഇസ്ലാം മദ്രസ</h1>
                        <p>താഴെ പുല്ലുംകുന്ന്</p>
                        <div style="background:var(--primary); color:white; padding:5px 15px; margin: 5px auto; width:max-content; border-radius:20px; font-size:14px; font-weight:bold;">പാദവാർഷിക പരീക്ഷാ ഫലം (2025-26)</div>
                    </div>

                    <div class="student-name"><i class="fa-solid fa-user-graduate web-icon"></i> ${student.ml}</div>
                    <div class="student-details">${uidDisplay}Adm No: ${student.admNo}</div>
                    ${statusDisplay}
                    
                    <table>
                        <thead>
                            <tr><th>വിഷയം (Subject)</th><th>മാർക്ക്</th></tr>
                        </thead>
                        <tbody>
                            ${marksHtml}
                            <tr class="total-row"><td>ആകെ മാർക്ക് (Total)</td><td>${student.total} / ${student.outOf}</td></tr>
                        </tbody>
                    </table>

                    <div class="grade-box">
                        ശതമാനം: <span style="color:var(--primary);">${student.percentage}%</span> | ഗ്രേഡ്: <span>${student.grade}</span>
                    </div>

                    <div class="signature-area">
                        <div>
                            <hr>
                            Class Teacher
                        </div>
                        <div>
                            <hr>
                            Headmaster
                        </div>
                    </div>
                </div>

                <div class="action-btns">
                    <button onclick="downloadPDF('${student.en}')" class="pdf-btn"><i class="fa-solid fa-file-pdf"></i> Print / PDF</button>
                    <a class="whatsapp-btn" href="https://wa.me/?text=${msg}" target="_blank">
                        <i class="fa-brands fa-whatsapp"></i> വാട്സാപ്പിൽ അയക്കുക
                    </a>
                </div>
            `;

            if (student.status === "PROMOTED") {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#065279', '#d4af37', '#27ae60', '#e74c3c', '#f1c40f'],
                    zIndex: 9999
                });
            }

        } else {
            resultDiv.innerHTML = `
                <div class="report-card" style="border-color:#e74c3c; text-align:center;">
                    <span style="font-size: 40px;">🔍</span><br>
                    <p style="color:#c0392b; font-weight:bold; margin-top:10px;">ക്ഷമിക്കണം, ഈ വിവരങ്ങൾ വെച്ച് റിസൾട്ട് കണ്ടെത്താനായില്ല. ടൈപ്പ് ചെയ്തത് ശരിയാണോ എന്ന് പരിശോധിക്കുക.</p>
                </div>`;
        }
    }

    function downloadPDF(studentName) {
        const element = document.getElementById('printable-area');
        element.classList.add('pdf-mode');

        const opt = {
            margin:       15,
            filename:     studentName + '_Result_2025.pdf',
            image:        { type: 'jpeg', quality: 1 },
            html2canvas:  { scale: 3, useCORS: true }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.classList.remove('pdf-mode');
        });
    }
</script>
