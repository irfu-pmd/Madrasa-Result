    function checkResult() {
        const classVal = document.getElementById('class').value;
        const input = document.getElementById('studentName').value.trim().toLowerCase();
        const resultDiv = document.getElementById('result');

        if (!classVal || !input) {
            alert("ദയവായി ക്ലാസ്സും Adm No അല്ലെങ്കിൽ UID നൽകുക.");
            return;
        }

        const classList = examResults[classVal] || [];
        
        // Search ONLY by AdmNo or UID
        const student = classList.find(s => {
            const admMatch = s.admNo && s.admNo === input;
            const uidMatch = s.uid && s.uid.toLowerCase() === input;
            return admMatch || uidMatch;
        });

        resultDiv.style.display = 'block';
        if (student) {
            
            let marksHtml = '';
            for (const [subject, data] of Object.entries(student.marks)) {
                let gradeColor = (data.grade === 'D' || data.grade === 'AB') ? 'color: var(--danger);' : 'color: #333;';
                marksHtml += `<tr>
                    <td style="font-weight:600;">${subject}</td>
                    <td style="text-align:center;">${data.mark}</td>
                    <td style="text-align:center; font-weight:bold; ${gradeColor}">${data.grade}</td>
                </tr>`;
            }

            const msg = encodeURIComponent(`${student.ml} ന്റെ പാദവാർഷിക പരീക്ഷാ ഫലം:\nആകെ മാർക്ക്: ${student.total}/${student.outOf}\nശതമാനം: ${student.percentage}%\nഗ്രേഡ്: ${student.grade}\nസ്റ്റാറ്റസ്: ${student.status}\nകൂടുതൽ വിവരങ്ങൾക്ക് മദ്രസ വെബ്സൈറ്റ് സന്ദർശിക്കുക.`);
            
            const uidDisplay = student.uid ? `UID: ${student.uid.toUpperCase()} | ` : '';
            const statusClass = student.status === 'PROMOTED' ? 'promoted' : 'needs-improvement';
            const statusDisplay = student.status !== '-' ? `<div class="status-badge ${statusClass}">${student.status}</div>` : '';
            const overallGradeColor = (student.grade === 'D' || student.grade === '-') ? 'grade-fail' : 'grade-pass';
            
            resultDiv.innerHTML = `
                <div id="printable-area" class="report-card">
                    <div class="print-header">
                        <img src="IMG_20260329_173830_154.webp" alt="Madrasa Logo">
                        <h1>അൻവാറുൽ ഇസ്ലാം മദ്രസ</h1>
                        <p>താഴെ പുല്ലുംകുന്ന്</p>
                        <div style="background:var(--primary); color:white; padding:6px 20px; margin: 5px auto; width:max-content; border-radius:20px; font-size:14px; font-weight:bold;">പാദവാർഷിക പരീക്ഷാ ഫലം (2025-26)</div>
                    </div>

                    <div class="student-name"><i class="fa-solid fa-user-graduate web-icon"></i> ${student.ml}</div>
                    <div class="student-details">${uidDisplay}Adm No: ${student.admNo}</div>
                    ${statusDisplay}
                    
                    <table>
                        <thead>
                            <tr>
                                <th>വിഷയം (Subject)</th>
                                <th style="text-align:center;">മാർക്ക്</th>
                                <th style="text-align:center;">ഗ്രേഡ്</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${marksHtml}
                            <tr class="total-row">
                                <td>ആകെ മാർക്ക് (Total)</td>
                                <td colspan="2" style="text-align:center;">${student.total} / ${student.outOf}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="grade-box">
                        ശതമാനം: <span style="color:var(--primary);">${student.percentage}%</span> | 
                        ഗ്രേഡ്: <span class="${overallGradeColor}">${student.grade}</span>
                    </div>

                    <div class="signature-area">
                        <div>
                            <hr>
                            Class Teacher
                        </div>
                        <div>
                            <hr>
                            Headmaster
                        </div>
                    </div>
                </div>

                <div class="action-btns">
                    <button onclick="downloadPDF('${student.en}')" class="pdf-btn"><i class="fa-solid fa-file-pdf"></i> Print / PDF</button>
                    <a class="whatsapp-btn" href="https://wa.me/?text=${msg}" target="_blank">
                        <i class="fa-brands fa-whatsapp"></i> വാട്സാപ്പിൽ അയക്കുക
                    </a>
                </div>
            `;

            if (student.status === "PROMOTED") {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#065279', '#d4af37', '#27ae60', '#e74c3c', '#f1c40f'],
                    zIndex: 9999
                });
            }

        } else {
            resultDiv.innerHTML = `
                <div class="report-card" style="border-color:#e74c3c; text-align:center;">
                    <span style="font-size: 40px;">🔍</span><br>
                    <p style="color:#c0392b; font-weight:bold; margin-top:10px;">ക്ഷമിക്കണം, ഈ നമ്പറിൽ റിസൾട്ട് കണ്ടെത്താനായില്ല. അടിച്ചത് ശരിയാണോ എന്ന് പരിശോധിക്കുക.</p>
                </div>`;
        }
    }

    function downloadPDF(studentName) {
        const element = document.getElementById('printable-area');
        element.classList.add('pdf-mode');

        const opt = {
            margin:       [5, 5, 5, 5], // മുകളിലും താഴെയുമുള്ള margin ഏറ്റവും ചുരുക്കി
            filename:     studentName + '_Result_2025.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, scrollY: 0, windowWidth: document.documentElement.offsetWidth }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.classList.remove('pdf-mode');
        });
    }
</script>
